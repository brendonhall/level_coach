# Items for every class. Source short names: see docs/research/.
- id: general-experience-preset
  title: Pick the Enhanced preset, or turn on quest guidance
  why: Forever ships Blizzard's own quest objective markers and points of interest. They replace half of what people install Questie for. Presentation only, not a ruleset.
  kind: setup
  level: {min: 1, max: 5}
  goals: [any]
  priority: normal
  where: {note: "Game Menu > Options > Experience preset"}
  done_when: {type: manual}
  verified: {forever: false}
  sources: &blizzard ["https://news.blizzard.com/en-us/article/24315821/wow-foreverwhats-new-and-what-feels-familiar"]

- id: general-cooldown-manager
  title: Turn on the built-in Cooldown Manager
  why: Forever has one; it is off by default and covers every class since the Oct 8 beta build.
  kind: setup
  level: {min: 1, max: 10}
  goals: [any]
  priority: low
  where: {note: "Options > Gameplay Enhancement"}
  done_when: {type: manual}
  verified: {forever: false}
  sources: &fm ["https://forevermastery.com/en/addons/forever-compatibility"]

- id: general-first-wand
  title: Get a wand as soon as you can afford one
  why: Wands are free damage with no mana cost. Every guide calls the first wand the biggest early upgrade for a caster. Lesser Magic Wand is enchanter-made and sells on the auction house.
  kind: item
  level: {min: 5, max: 20}
  classes: [WARLOCK, MAGE, PRIEST]
  goals: [any]
  priority: high
  where: {note: "Auction house or any enchanter; wand skill is default for casters"}
  done_when: {type: manual}
  verified: {forever: false}
  sources: &method ["https://www.method.gg/wow-forever/wow-forever-warlock-leveling-guide-and-talents"]

- id: general-pick-professions
  title: Pick two professions
  why: Guides lean Tailoring plus Enchanting for a cloth caster. Gathering pays for riding at 40 on a fresh economy. Professions also unlock campsite buffs from skill 20.
  kind: profession
  level: {min: 5, max: 20}
  goals: [any]
  priority: high
  where: {note: "Brill or Undercity profession trainers"}
  done_when:
    type: any_of
    of:
      - {type: skill_line, name: Tailoring, min: 1}
      - {type: skill_line, name: Enchanting, min: 1}
      - {type: skill_line, name: Herbalism, min: 1}
      - {type: skill_line, name: Mining, min: 1}
      - {type: skill_line, name: Skinning, min: 1}
      - {type: skill_line, name: Alchemy, min: 1}
      - {type: skill_line, name: Engineering, min: 1}
      - {type: skill_line, name: Leatherworking, min: 1}
      - {type: skill_line, name: Blacksmithing, min: 1}
  verified: {forever: false}
  sources: &tavern ["https://www.warcrafttavern.com/forever/guides/warlock-leveling/"]

- id: general-first-aid
  title: Learn First Aid
  why: Bandages heal between pulls or while a mob is feared. In Forever, First Aid also makes healing potions and cures for poisons, diseases and bleeds, which a warlock cannot otherwise remove.
  kind: profession
  level: {min: 5, max: 60}
  goals: [any]
  priority: high
  done_when: {type: skill_line, name: First Aid, min: 1}
  verified: {forever: false}
  sources: *tavern

- id: general-cooking
  title: Learn Cooking
  why: Well Fed food gives about 5% more kill XP, and your own campsite needs a cooking fire.
  kind: profession
  level: {min: 5, max: 60}
  goals: [any]
  priority: low
  done_when: {type: skill_line, name: Cooking, min: 1}
  verified: {forever: false}
  sources: *tavern

- id: general-camping-unlock
  title: Unlock camping
  why: New Forever system. Sit at a campfire to pick up campsite buffs; every profession adds a camp buff from skill 20. Start with the adventurer outside the first quest hub and the quest The Great Outdoors.
  kind: quest
  level: {min: 5, max: 12}
  goals: [any]
  priority: normal
  done_when: {type: manual}
  verified: {forever: false}
  sources: &wiki ["https://warcraft.wiki.gg/wiki/World_of_Warcraft:_Forever"]

- id: general-bags-four-slots
  title: Fill all four bag slots
  why: Shards, quest items and loot pile up fast. Any 6-slot bag is fine early; vendor greys and auction greens to pay for them.
  kind: setup
  level: {min: 5, max: 20}
  goals: [any]
  priority: normal
  done_when: {type: manual}
  verified: {forever: false}
  sources: *method

