name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install -e '.[dev]'
      - name: Python and Lua tests
        run: python -m pytest -q
      - name: Generated data is current
        run: python -m tools.build_data --check
      - name: Lint addon Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check
          luacheck LevelCoach GuildKin
